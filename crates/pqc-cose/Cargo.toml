[package]
name = "pqc-cose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Strict RFC 9964 ML-DSA COSE public AKP identity normalization (metadata only)."
readme = "README.md"

# FOSS-424: bootstrap crates cannot be published. A separate, reviewed release
# increment must validate the public API, registry ownership, and package contents.
publish = false

[dependencies]
pqc-kit = { version = "=0.1.0", path = "../pqc-kit" }
cryptopolicy = { version = "=0.1.0", path = "../cryptopolicy" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lints]
workspace = true
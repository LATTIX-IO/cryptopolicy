[package]
name = "pqc-x509"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "pqc-x509 library for the cryptopolicy project."
readme = "README.md"

# FOSS-424: bootstrap crates cannot be published. A separate, reviewed release
# increment must validate the public API, registry ownership, and package contents.
publish = false

[dependencies]
pqc-kit = { version = "=0.1.0", path = "../pqc-kit" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"

[lints]
workspace = true
name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unpublished crates and protected release workflows
        run: |
          python3 -m venv /tmp/cryptopolicy-release-guard
          /tmp/cryptopolicy-release-guard/bin/python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-release-guard.txt
          /tmp/cryptopolicy-release-guard/bin/python scripts/release_guard.py
          /tmp/cryptopolicy-release-guard/bin/python -m unittest discover -s tests -p 'test_release_guard.py' -v

      - name: Audit normative cryptographic policy security contract
        run: |
          python3 scripts/security_contract.py --lint
          python3 -m unittest discover -s tests -p 'test_security_contract.py' -v

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify declared Rust 1.85 MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --all-features --locked
          cargo +1.85.0 test --workspace --all-features --locked

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-semver-checks

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features

  foss445-snapshot-temp:
    name: FOSS-445 catalog checksum and rustfmt snapshot (temporary)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Capture checksum and exact formatted sources
        run: |
          sha256sum crates/pqc-kit/data/catalog-v1.json
          cargo fmt --all
          echo "FOSS445_FMT_LIB=$(base64 -w0 crates/pqc-kit/src/lib.rs)"
          echo "FOSS445_FMT_TEST=$(base64 -w0 crates/pqc-kit/tests/catalog.rs)"
          echo "FOSS445_FMT_EXAMPLE=$(base64 -w0 crates/pqc-kit/examples/catalog_smoke.rs)"

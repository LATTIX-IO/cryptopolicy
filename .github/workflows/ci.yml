name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unpublished crates and protected release workflows
        run: |
          python3 -m venv /tmp/cryptopolicy-release-guard
          /tmp/cryptopolicy-release-guard/bin/python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-release-guard.txt
          /tmp/cryptopolicy-release-guard/bin/python scripts/release_guard.py
          /tmp/cryptopolicy-release-guard/bin/python -m unittest discover -s tests -p 'test_release_guard.py' -v

      - name: Audit normative cryptographic policy security contract
        run: |
          python3 scripts/security_contract.py --lint
          python3 -m unittest discover -s tests -p 'test_security_contract.py' -v

      - name: Verify partial normative-to-runtime conformance crosswalk
        run: |
          python3 scripts/conformance_coverage.py
          python3 -m unittest discover -s tests -p 'test_conformance_coverage.py' -v

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Direct runtime checks against checked-in normative cases
        run: cargo test -p cryptopolicy --test normative_runtime --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify declared Rust 1.85 MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --workspace --all-targets --all-features --locked
          cargo +1.85.0 test --workspace --all-features --locked

      - name: Clean external consumer from pinned Git revision
        run: |
          cargo generate-lockfile --manifest-path acceptance/fresh-consumer/Cargo.toml
          cargo run --manifest-path acceptance/fresh-consumer/Cargo.toml --locked

      - name: Package-archive and isolated local-registry acceptance
        run: |
          python3 -m unittest discover -s tests -p 'test_package_acceptance.py' -v
          python3 scripts/package_acceptance.py

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny
          cargo install --locked cargo-semver-checks

      - name: RustSec audit
        run: cargo audit

      - name: Dependency policy
        run: cargo deny check

      - name: SemVer compatibility
        run: cargo semver-checks check-release --workspace --all-features

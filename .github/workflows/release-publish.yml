name: Publish crates (manual, protected)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to request an approved crates.io release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'LATTIX-IO/cryptopolicy' &&
          github.ref == 'refs/heads/main' &&
          inputs.confirm == 'PUBLISH' &&
          vars.CRYPTOPOLICY_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io-publish
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout approved main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Publish eligible releases
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
